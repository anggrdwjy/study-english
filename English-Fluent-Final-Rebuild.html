trak, budaya kerja",topics:["Employment Contract","Work Culture SG/AU","Safety Briefing","Final Check"],color:"#172554"},{id:"L7",code:"L7",title:"TOEFL Structure",desc:"subject verb, parallelism",topics:["Subject-Verb Agreement","Parallelism","Tenses","Inversion"],color:"#7C3AED"},{id:"L8",code:"L8",title:"TOEFL Reading Listening",desc:"passage akademik + listening TTS",topics:["Academic Passage","Inference","Listening Note","Detail Question"],color:"#6D28D9"},{id:"L9",code:"L9",title:"IELTS Reading Writing",desc:"True False Not Given + Task1 chart + Task2",topics:["T/F/NG Strategy","Chart Description","Task 2 Essay","Cohesion"],color:"#BE185D"},{id:"L10",code:"L10",title:"IELTS Speaking Listening",desc:"Part1-3 + listening fill blank",topics:["Speaking Part 1-3","Fluency Markers","Listening Fill Blank","Band 7 Vocab"],color:"#9D174D"}],Zp=[{q:"I ___ from Indonesia. I work in housekeeping.",opts:["am","is","are","be"],ans:0},{q:"What time does your shift start?",opts:["At 7 AM","Yes","Thank you","Housekeeping"],opts2:["At 7 AM","Yes","Thank you","Housekeeping"],ans:0},{q:"Could you please ___ the report to Mr. Lee?",opts:["send","sending","sent","to send"],ans:0},{q:"My previous job ___ in a hotel in Bali for 2 years.",opts:["was","is","are","were"],ans:0},{q:"Choose the correct formal email opening",opts:["Yo Mr Lee","Dear Mr. Lee,","Hi bro","Hey"],ans:1},{q:"What is 'trolley' in housekeeping?",opts:["Troli kebersihan","Sapu","Handuk","Sabun"],ans:0},{q:"The manager ___ the report yesterday.",opts:["checked","check","checking","checks"],ans:0},{q:"IELTS Reading: If passage says 'Some workers prefer night shift', statement 'All workers like night shift' is?",opts:["True","False","Not Given","Maybe"],ans:1},{q:"Best answer for 'What is your weakness?'",opts:["I am lazy","I sometimes focus too much on details, but I'm learning to manage time","No weakness","I don't know"],ans:1},{q:"Which is parallel? 'She likes cooking, reading, and ___'",opts:["to swim","swimming","swim","swam"],ans:1},{q:"Fill: I have ___ experience in F&B for 3 years.",opts:["an","many","experience / 3 years of","a"],ans:2},{q:"Listening: 'Can you work overtime?' Best reply",opts:["No","Yes, I am willing to work overtime if needed","Maybe","What?"],ans:1}],Jp={L1:{reading:{text:"Hello! My name is Siti. I am from Indonesia. I am 25 years old. I work as a housekeeper. I wake up at 5 AM every day. Good morning, Mrs. Smith! How are you today? I am fine, thank you. This is the foundation of work English. Greeting is very important in hospitality.",qs:[{q:"What is Siti's job?",opts:["Housekeeper","Chef","Driver","Nurse"],ans:0},{q:"What time does Siti wake up?",opts:["5 AM","6 AM","7 AM","8 AM"],ans:0},{q:"'How are you?' - best reply?",opts:["I am fine, thank you","No","Housekeeping","Yes sir"],ans:0}]},writing:{prompt:"Tulis perkenalan diri 3 kalimat: nama, asal, pekerjaan. Contoh: My name is... I am from... I work as...",keywords:["my name","from","work as","indonesia"],example:"My name is Budi. I am from Lombok, Indonesia. I work as a housekeeper and I have 2 years of experience."},speaking:{prompt:"Introduce yourself for 20 seconds. Say your name, country, and job.",tips:"Gunakan: My name is... I am from... I work as..."}},L2:{reading:{text:"Shift starts at 7 AM and finishes at 3 PM. There are 24 rooms on the second floor. You need 15 towels, 10 soaps, and 2 trolleys. Please clean room 205 first. The vacuum is in the storage. Be careful with the glass. Numbers and instructions are critical for daily work.",qs:[{q:"When does shift finish?",opts:["3 PM","7 AM","5 PM","12 PM"],ans:0},{q:"How many towels needed?",opts:["15","10","2","24"],ans:0},{q:"Which room to clean first?",opts:["205","204","Second floor","Storage"],ans:0}]},writing:{prompt:"Tulis laporan singkat: berapa kamar dibersihkan, masalah apa. Gunakan angka.",keywords:["rooms","cleaned","towels","report"],example:"Today I cleaned 12 rooms. I used 20 towels. Room 210 needs repair. I finished at 3 PM."},speaking:{prompt:"Explain your daily tasks using numbers: How many rooms? What time?",tips:"Gunakan: I clean... rooms, I start at... I need... towels"}},L3:{reading:{text:"Excuse me, Mr. Lee. May I leave early today? My mother is sick. I have finished cleaning 10 rooms and submitted the report. I will come early tomorrow at 6 AM. Thank you for your understanding. Professional permission is important in Singapore and Dubai work culture.",qs:[{q:"Why does she ask permission?",opts:["Mother sick","Lazy","Finished work","Holiday"],ans:0},{q:"How many rooms finished?",opts:["10","12","5","6"],ans:0},{q:"When will she come tomorrow?",opts:["6 AM","7 AM","5 AM","8 AM"],ans:0}]},writing:{prompt:"Tulis email izin: alasan, pekerjaan selesai, janji datang lebih awal.",keywords:["may i","permission","finished","tomorrow"],example:"Dear Mr. Lee, May I leave early today? I have finished my tasks. My family needs me. I will come at 6 AM tomorrow. Thank you."},speaking:{prompt:"Ask permission to your manager. Reason + solution.",tips:"Pakai: May I...? I have finished... I will..."}},L4:{reading:{text:"Good morning, I am Dewi. I have 3 years experience in housekeeping at Grand Bali Hotel. I can clean 15 rooms per day, handle laundry, and speak basic English. I am hardworking, punctual, and willing to learn. I want to work in Singapore to support my family and grow my career.",qs:[{q:"How long experience?",opts:["3 years","2 years","1 year","5 years"],ans:0},{q:"How many rooms per day?",opts:["15","10","20","12"],ans:0},{q:"Why Singapore?",opts:["Support family & grow","Holiday","No reason","Friend"],ans:0}]},writing:{prompt:"Tulis paragraf CV: pengalaman, skill, alasan kerja luar negeri.",keywords:["experience","years","hardworking","willing"],example:"I have 2 years experience as F&B staff. I am hardworking and punctual. I can work under pressure and in a team. I want to work abroad to improve my skills."},speaking:{prompt:"Tell me about yourself in 30 seconds - for interview.",tips:"Structure: Name + Experience + Skills + Goal"}},L5:{reading:{text:"Subject: Room Cleaning Report - Floor 3. Dear Mr. Johnson, Please find attached the cleaning report for floor 3. All 12 rooms have been cleaned and inspected. Room 305 requires maintenance for the AC. I will follow up tomorrow morning. Thank you for your support. Best regards, Siti. Formal email needs clear subject and polite closing.",qs:[{q:"What is email about?",opts:["Cleaning report floor 3","Resignation","Leave","Complaint"],ans:0},{q:"Which room needs maintenance?",opts:["305","3","12","All"],ans:0},{q:"Closing phrase?",opts:["Best regards","Yo","See ya","Bye"],ans:0}]},writing:{prompt:"Tulis email formal: subject jelas, laporan, permintaan maintenance, closing sopan.",keywords:["dear","attached","requires","regards"],example:"Subject: Daily Report - F&B. Dear Ms. Anna, I have completed service for 30 guests. We need more spoons. Please advise. Best regards, Budi."},speaking:{prompt:"Lead a short meeting update: what you did, problem, plan.",tips:"Use: Today I... The issue is... My plan is..."}},L6:{reading:{text:"Employment Contract: Working hours 10 hours/day, 6 days/week. Overtime paid. Accommodation provided. Salary SGD 800 basic + overtime. 2 years contract. Medical insurance included. In Singapore, punctuality and respect are very important. No phone during work. Always say Yes, sir/ma'am. Understanding contract is critical before flying.",qs:[{q:"Working hours per day?",opts:["10 hours","8 hours","12 hours","6 hours"],ans:0},{q:"Salary?",opts:["SGD 800 + OT","SGD 500","Free","SGD 1000"],ans:0},{q:"Important in SG?",opts:["Punctuality & respect","Late","Phone OK","No respect"],ans:0}]},writing:{prompt:"Tulis pemahaman kontrak: jam kerja, gaji, fasilitas, komitmen 2 tahun.",keywords:["contract","hours","salary","accommodation"],example:"I understand the contract is 2 years, 10 hours per day. Salary SGD 800 plus overtime. Accommodation and medical provided. I agree and am willing to work hard."},speaking:{prompt:"Explain you understand contract and are ready.",tips:"Use: I understand... I agree... I am willing..."}},L7:{reading:{text:"TOEFL Structure Tip: Subject-Verb Agreement is #1 error. 'The manager has checked' not 'have'. Parallelism: 'She likes cooking, reading, and swimming' - same -ing form. For Indonesian workers, avoid direct translation: Don't say 'I am work', say 'I work' or 'I am working'. Mastering structure boosts score from 400 to 500.",qs:[{q:"Correct: The staff ___ ready.",opts:["is","are","am","be"],ans:0},{q:"Parallel: He is smart, kind, and ___",opts:["hardworking","hardwork","hardly work","worked"],ans:0},{q:"Avoid: 'I ___ work in hotel'",opts:["","am","is","are"],ans:0}]},writing:{prompt:"Tulis 3 kalimat parallel dan benar subject-verb untuk email kerja.",keywords:["has","is","and"],example:"The team has finished cleaning, checking, and reporting. She is punctual and hardworking. The manager has approved my leave."},speaking:{prompt:"Explain parallelism rule in your own words.",tips:"Explain with example: cooking, reading, swimming"}},L8:{reading:{text:"Academic Passage: Housekeeping industry in cruise ships requires high stamina. Workers handle 18 cabins daily, often 12-hour shifts. Academic vocabulary like 'stamina, handling, efficiency' appears in TOEFL. Listening: You will hear 'Could you bring extra towels to deck 5?' Key skill: note numbers and locations. TOEFL Reading needs skimming for main idea.",qs:[{q:"Cruise workers handle how many cabins?",opts:["18","10","12","24"],ans:0},{q:"Shift length?",opts:["12 hours","8 hours","10 hours","6 hours"],ans:0},{q:"Main idea?",opts:["Cruise work needs stamina","Cruise is fun","Towels","Deck 5"],ans:0}]},writing:{prompt:"Summarize passage 2 sentences + note listening strategy.",keywords:["stamina","cabins","listening","numbers"],example:"The passage says cruise work needs high stamina, 18 cabins per day. For listening, I will note numbers and deck locations."},speaking:{prom
